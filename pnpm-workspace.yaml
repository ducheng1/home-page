shellEmulator: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver

allowBuilds:
  '@parcel/watcher': false
  '@tailwindcss/oxide': false
  esbuild: false
  unrs-resolver: false
  vue-demi: false

catalog:
  '@antfu/eslint-config': ^9.2.0
  '@commitlint/cli': ^21.2.1
  '@commitlint/config-conventional': ^21.2.0
  '@iconify-json/lucide': ^1.2.119
  '@nuxt/eslint': ^1.16.0
  '@nuxt/ui': ^4.10.0
  cz-git: ^1.13.1
  czg: ^1.13.1
  eslint: ^10.8.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-prettier: ^5.5.6
  husky: ^9.1.7
  nano-staged: ^1.0.2
  nuxt: ^4.5.0
  prettier: ^3.9.6
  tailwindcss: ^4.3.3
  typescript: ^6.0.3
  vue-tsc: ^3.3.8
