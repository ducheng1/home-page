shellEmulator: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver

allowBuilds:
  '@parcel/watcher': false
  '@tailwindcss/oxide': false
  esbuild: true
  sharp: false
  unrs-resolver: false
  vue-demi: true

catalog:
  '@antfu/eslint-config': ^9.2.0
  '@commitlint/cli': ^21.2.1
  '@commitlint/config-conventional': ^21.2.0
  '@iconify-json/lucide': ^1.2.119
  '@nuxt/eslint': ^1.16.0
  '@nuxt/image': ^2.0.0
  '@nuxt/ui': ^4.10.0
  '@nuxtjs/seo': ^5.3.6
  '@vueuse/core': ^14.3.0
  '@vueuse/nuxt': ^14.3.0
  clsx: ^2.1.1
  cz-git: ^1.13.1
  czg: ^1.13.1
  eslint: ^10.8.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-prettier: ^5.5.6
  gsap: ^3.15.0
  husky: ^9.1.7
  nano-staged: ^1.0.2
  nuxt: ^4.5.0
  prettier: ^3.9.6
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.3.3
  tw-animate-css: ^1.4.0
  typescript: ^6.0.3
  vue-tsc: ^3.3.8
